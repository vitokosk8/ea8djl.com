baseURL = "https://ea8djl.com/blog/"
locale = "es-es"
title = "Blog · EA8DJL"
theme = "PaperMod"
enableRobotsTXT = false

[pagination]
  pagerSize = 10

[permalinks]
  posts = "/:slug/"

[params]
  env = "production"
  defaultTheme = "auto"
  mainSections = ["posts"]
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = true

  [params.homeInfoParams]
    Title = "Blog"
    Content = "Historias de redes, formación e Internet."

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/victorbguerra/"
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/vitokosk8"
  [[params.socialIcons]]
    name = "rss"
    url = "https://ea8djl.com/blog/index.xml"

[menu]
  [[menu.main]]
    name = "Inicio"
    url = "https://ea8djl.com/"
    weight = 10
  [[menu.main]]
    name = "Etiquetas"
    pageRef = "/tags"
    weight = 20
