baseURL = "https://ea8djl.com/blog/"
title = "Blog · EA8DJL"
theme = "PaperMod"
enableRobotsTXT = false

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[pagination]
  pagerSize = 10

[permalinks]
  posts = "/:slug/"

[params]
  env = "production"
  defaultTheme = "auto"
  mainSections = ["posts"]
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = true

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/victorbguerra/"
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/vitokosk8"
  [[params.socialIcons]]
    name = "rss"
    url = "https://ea8djl.com/blog/index.xml"

[languages]

  [languages.en]
    languageName = "English"
    languageCode = "en-GB"
    weight = 1
    [languages.en.params.homeInfoParams]
      Title = "Blog"
      Content = "Stories on networks, training and the Internet."
    [[languages.en.menu.main]]
      name = "Home"
      url = "https://ea8djl.com/"
      weight = 10
    [[languages.en.menu.main]]
      name = "Español"
      url = "https://ea8djl.com/blog/es/"
      weight = 20
    [[languages.en.menu.main]]
      name = "Tags"
      pageRef = "/tags"
      weight = 30

  [languages.es]
    languageName = "Español"
    languageCode = "es-ES"
    contentDir = "content/es"
    weight = 2
    [languages.es.params.homeInfoParams]
      Title = "Blog"
      Content = "Historias de redes, formación e Internet."
    [[languages.es.menu.main]]
      name = "Inicio"
      url = "https://ea8djl.com/"
      weight = 10
    [[languages.es.menu.main]]
      name = "English"
      url = "https://ea8djl.com/blog/"
      weight = 20
    [[languages.es.menu.main]]
      name = "Etiquetas"
      pageRef = "/tags"
      weight = 30
