{{- if .IsHome }}
{{- with resources.Get "img/maspalomas.jpg" }}
{{- $sm := .Resize "800x webp q75" }}
{{- $md := .Resize "1600x webp q80" }}
{{- $lg := .Resize "2560x webp q80" }}
<style>
  html, body { background: transparent; }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background-image: linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.55)), url("{{ $sm.RelPermalink }}");
    background-size: cover; background-position: center;
  }
  @media (min-width: 801px) {
    body::before { background-image: linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.55)), url("{{ $md.RelPermalink }}"); }
  }
  @media (min-width: 1601px) {
    body::before { background-image: linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.55)), url("{{ $lg.RelPermalink }}"); }
  }
  .profile, .header a, #theme-toggle, .footer, .footer a, .social-icons a { color: #fff !important; }
  .profile .button {
    background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.5);
    color: #fff; backdrop-filter: blur(4px);
  }
</style>
{{- end }}
{{- end }}
